name: Generar APK de prueba

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Validar contenido curricular
        run: python3 scripts/validate_curriculum.py

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Preparar Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compilar APK de depuración
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Easy-English-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
